<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04110d">
  <meta name="description" content="Tower defense where you program your turrets in real Python and wire them to power.">
  <title>Circuit Defense</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="brand">CIRCUIT<span>//</span>DEFENSE</div>
    <div class="stat" id="st-credits"><span class="lbl">Credits</span><b>0</b></div>
    <div class="stat" id="st-core"><span class="lbl">Core</span><b>20/20</b><span class="bar"><i></i></span></div>
    <div class="stat" id="st-wave"><span class="lbl">Wave</span><b>1/10</b></div>
    <div class="stat" id="st-power"><span class="lbl">Power</span><b>0/120 W</b></div>
    <div class="spacer"></div>
    <div class="speed" id="speed">
      <button data-speed="pause" title="Pause (P)">❚❚</button>
      <button data-speed="1">1×</button>
      <button data-speed="2">2×</button>
      <button data-speed="3">3×</button>
    </div>
    <button id="btn-wave" class="primary">Start wave ▶</button>
    <button id="btn-layout" class="icon" title="Switch layout">📱</button>
    <button id="btn-player" class="icon" title="Players">👤</button>
    <button id="btn-maps" class="icon" title="Campaign / maps">🗺</button>
    <button id="btn-guide" class="icon" title="Lessons">📘</button>
    <button id="btn-mute" class="icon" title="Sound">🔊</button>
    <button id="btn-settings" class="icon" title="Settings">⚙</button>
  </header>

  <main id="main">
    <div id="stage">
      <canvas id="board"></canvas>
      <div id="banner"></div>
      <div id="tip" hidden></div>
      <div id="tooltip"></div>
      <div id="toasts"></div>
      <div id="info" class="card" hidden></div>
      <section id="editor" class="pane float" hidden>
        <div class="pane-head" id="ed-drag" title="Drag to move">
          <div><span class="kicker" id="ed-kicker"></span><h2 id="ed-title"></h2></div>
          <button id="ed-paused" class="chip paused-chip" hidden title="The game is paused while you edit. Click to keep it running.">⏸ Paused · ▶ play</button>
          <span id="ed-status" class="chip">Running</span>
          <button class="icon mobile-only" id="ed-guide" title="Show the lesson under the code">📘</button>
          <button class="icon" id="ed-close" title="Close (Esc)">✕</button>
        </div>
        <div id="ed-task" class="ed-task" hidden></div>
        <div class="tabs">
          <button data-tab="code" class="on">Code</button>
          <button data-tab="power">Power</button>
          <button data-tab="docs">Docs</button>
          <button data-tab="lesson" class="phone-only">Lesson</button>
          <button data-tab="console" class="phone-only">Console</button>
        </div>
        <div class="tab-body" id="tab-code">
          <div id="cm-host"></div>
          <div id="chipbar" class="phone-only"></div>
          <div class="ed-actions">
            <button id="ed-upload" class="primary" title="Ctrl+S">Upload ▲</button>
            <button id="ed-hint" class="ghost" title="Show the next line of the answer faintly (you still type it)">💡 Hint</button>
            <button id="ed-revert" class="ghost" title="Back to the running program">Revert</button>
            <select id="ed-copy"><option value="">Copy from…</option></select>
            <button id="ed-template" class="ghost">Template</button>
          </div>
          <div class="console-head">Console <button id="ed-clear" class="link">clear</button></div>
          <div id="console"></div>
        </div>
        <div class="tab-body scroll" id="tab-power" hidden></div>
        <div class="tab-body scroll docs" id="tab-docs" hidden></div>
        <div class="tab-body scroll lesson" id="tab-lesson" hidden></div>
      </section>
      <div id="boot"><div class="spinner"></div><span>Booting Python…</span></div>
    </div>

    <aside id="side" class="no-anim">
      <section id="guide" class="pane">
        <div class="pane-head">
          <div><span class="kicker">Lesson <b id="lesson-num">1</b></span><h2 id="lesson-title"></h2></div>
          <button class="icon mobile-only sheet-toggle" title="Show more / less"><span class="st-arrow">▴</span><span class="st-close">✕ Close</span></button>
        </div>
        <div class="pane-body">
          <div id="guide-tip" class="tipbox" hidden></div>
          <div id="lesson-body" class="lesson"></div>
          <div id="lesson-tasks"></div>
          <div class="row">
            <button id="btn-hint" class="ghost">Hint</button>
            <button id="btn-solution" class="ghost">Show solution</button>
          </div>
          <div id="lesson-hint" class="hintbox" hidden></div>
          <div id="lesson-sol" class="hintbox" hidden></div>
          <h4>Next: <span id="wave-title"></span></h4>
          <div id="wave-preview"></div>
          <button id="lesson-go" class="primary phone-only">Continue</button>
        </div>
      </section>
    </aside>
  </main>

  <nav id="tools"></nav>
</div>

<div id="modal" hidden><div class="modal-box"></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
